name: qwen-tp2
services:
  model:
    image: ${IMAGE:-local/lil-qwen38:arm64-20261016.2}
    init: true
    network_mode: host
    ipc: host
    restart: "no"
    devices:
      - /dev/infiniband:/dev/infiniband
    cap_add: [IPC_LOCK]
    security_opt: [seccomp=unconfined]
    ulimits:
      memlock: {soft: -1, hard: -1}
      stack: {soft: 67108864, hard: 67108864}
    volumes:
      - ${HF_CACHE:?Set HF_CACHE}:/root/.cache/huggingface
      - runtime-1016:/cache
      - .:/recipe:ro
      - ./qwen38fn-chat-template.jinja:/serving/qwen38fn-chat-template.jinja:ro
    entrypoint: ["/bin/bash", "/recipe/run-rank${NODE_RANK:?Set NODE_RANK}.sh"]
    environment:
      HF_HUB_OFFLINE: "1"
      NODE_RANK: ${NODE_RANK}
      VLLM_HOST_IP: ${VLLM_HOST_IP:?Set VLLM_HOST_IP}
      MASTER_ADDR: ${MASTER_ADDR:?Set MASTER_ADDR}
      NCCL_SOCKET_IFNAME: ${NCCL_SOCKET_IFNAME:?Set NCCL_SOCKET_IFNAME}
      GLOO_SOCKET_IFNAME: ${NCCL_SOCKET_IFNAME}
      NCCL_IB_HCA: ${NCCL_IB_HCA:?Set NCCL_IB_HCA}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
volumes:
  runtime-1016:
